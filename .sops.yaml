# Recipients for sops-encrypted secrets. See secrets/README.md for the
# add-a-host / add-a-secret / bootstrap workflow.
#
# Replace every age1... placeholder below with a real key:
#   admin  -> your personal key:  age-keygen -y ~/.config/sops/age/keys.txt
#   <host> -> that host's key:    ssh-keyscan -t ed25519 <host> | ssh-to-age
#
# A host can only decrypt a file whose creation_rule lists it. After adding a
# host here, re-key the files it needs:  sops updatekeys secrets/<file>.yaml
keys:
  - &admin    age1jcmg5wqk8426vkkkdw4lazuuh7ed82wpqjw53an5pfvh6hefwqxq4nff83
  - &ganymede age1674jzhd53mkv0t6ggaj0dm3xcgnxjdrjtxmlqshzc4yd5lm4vy3qtf4fz8
  - &io       age18qgra2vhnae00g5qwkpaapwn7hufeekumwfzkmtrt8x4yfmzvatq7w0f3l
  - &callisto age1REPLACE_CALLISTO_HOST
  - &europa   age1REPLACE_EUROPA_HOST

creation_rules:
  # Secrets every host needs (e.g. the user login password).
  - path_regex: secrets/common\.yaml$
    key_groups:
      - age: [*admin, *ganymede, *io]

  # europa-only secrets (e.g. the Samba password).
  - path_regex: secrets/europa\.yaml$
    key_groups:
      - age: [*admin, *europa]
